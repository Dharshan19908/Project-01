<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>
    <h1>Simple Calculator</h1>
    <form name="Calculator">
        <input type="text" id="num1" placeholder="Enter first number"><br><br>
        <input type="text" id="num2" placeholder="Enter second number"><br><br>
        <input type="button" value="Add" onclick="calculate('+')">
        <input type="button" value="Subtract" onclick="calculate('-')">
        <input type="button" value="Multiply" onclick="calculate('*')">
        <input type="button" value="Divide" onclick="calculate('/')"><br><br>
        <input type="text" id="result" placeholder="Result" readonly><br><br>
        <script>
            function calculate(operator) {
                let num1 = parseFloat(document.getElementById("num1").value);
                let num2 = parseFloat(document.getElementById("num2").value);
                let result;

                if (isNaN(num1) || isNaN(num2)) {
                    alert("Please enter valid numbers");
                    return;
                }

                switch (operator) {
                    case '+':
                        result = num1 + num2;
                        break;
                    case '-':
                        result = num1 - num2;
                        break;
                    case '*':
                        result = num1 * num2;
                        break;
                    case '/':
                        if (num2 === 0) {
                            alert("Cannot divide by zero");
                            return;
                        }
                        result = num1 / num2;
                        break;
                    default:
                        alert("Invalid operator");
                        return;
                }

                document.getElementById("result").value = result;
            }
            </script>
 </form>

</body>
   
</html>
